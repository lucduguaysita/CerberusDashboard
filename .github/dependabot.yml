version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The ASP.NET Core / runtime packages are versioned together and the app
      # ships self-contained, so bump them as one unit.
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
